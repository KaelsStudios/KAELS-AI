<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<meta
    name="theme-color"
    content="#06070b"
>

<title>KAEL ASSISTANT</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:#06070b;
    color:#fff;

    overflow-x:hidden;
}


/* =========================================================
   BACKGROUND
========================================================= */

#background{
    position:fixed;
    inset:0;

    z-index:-10;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(82,96,255,.16),
            transparent 32%
        ),

        radial-gradient(
            circle at 85% 80%,
            rgba(0,210,255,.10),
            transparent 34%
        ),

        #06070b;
}


/* =========================================================
   WELCOME
========================================================= */

#welcome{
    position:fixed;

    inset:0;

    z-index:99999;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.70);

    opacity:1;
    visibility:visible;

    transition:
        opacity .35s ease,
        visibility .35s ease;
}

#welcome.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.welcome-card{
    width:min(480px,100%);

    padding:36px 26px;

    text-align:center;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(30,30,40,.92),
            rgba(12,12,18,.92)
        );

    border:
        1px solid
        rgba(255,255,255,.10);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.65);
}

.welcome-logo{
    width:70px;
    height:70px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:21px;

    background:#fff;
    color:#050505;

    font-size:28px;
    font-weight:1000;

    box-shadow:
        0 12px 35px
        rgba(255,255,255,.12);
}

.welcome-title{
    margin-top:22px;

    font-size:
        clamp(31px,8vw,53px);

    line-height:1;

    font-weight:1000;

    letter-spacing:-2px;

    text-shadow:
        2px 2px 0 #000,
        -2px -2px 0 #000;
}

.welcome-sub{
    margin-top:13px;

    color:#9c9cab;

    font-size:14px;
}

.welcome-name{
    margin-top:7px;

    font-size:18px;

    font-weight:900;
}

#skipWelcome{
    width:100%;

    min-height:52px;

    margin-top:29px;

    border:none;

    border-radius:15px;

    background:#fff;

    color:#050507;

    font-size:14px;

    font-weight:950;

    cursor:pointer;

    transition:
        transform .12s ease,
        opacity .12s ease;
}

#skipWelcome:active{
    transform:scale(.97);
}


/* =========================================================
   AUTH
========================================================= */

#authScreen{
    min-height:100vh;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;
}

#authScreen.show{
    display:flex;
}

.auth-card{
    width:min(460px,100%);

    padding:31px 25px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(25,25,34,.94),
            rgba(10,10,15,.94)
        );

    border:
        1px solid
        rgba(255,255,255,.10);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.55);
}

.auth-logo{
    width:66px;
    height:66px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:20px;

    background:#fff;
    color:#000;

    font-size:26px;
    font-weight:1000;
}

.auth-title{
    margin-top:20px;

    text-align:center;

    font-size:28px;

    font-weight:1000;
}

.auth-description{
    margin-top:9px;

    color:#92929f;

    text-align:center;

    font-size:13px;

    line-height:1.5;
}

.google-button{
    width:100%;

    min-height:54px;

    margin-top:25px;

    border:none;

    border-radius:15px;

    background:#fff;

    color:#111;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:11px;

    font-size:14px;

    font-weight:900;

    cursor:pointer;

    transition:
        transform .12s ease;
}

.google-button:active{
    transform:scale(.98);
}

.google-icon{
    width:22px;
    height:22px;
}

.auth-note{
    margin-top:14px;

    color:#6e6e7b;

    text-align:center;

    font-size:10px;

    line-height:1.5;
}


/* =========================================================
   APP
========================================================= */

#app{
    display:none;

    min-height:100vh;
}

#app.show{
    display:block;
}

.app-layout{
    width:100%;

    min-height:100vh;

    display:flex;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    position:fixed;

    left:0;
    top:0;
    bottom:0;

    width:250px;

    padding:18px;

    background:
        rgba(8,8,13,.82);

    border-right:
        1px solid
        rgba(255,255,255,.07);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    z-index:100;
}

.brand{
    display:flex;

    align-items:center;

    gap:11px;

    padding:8px;

    margin-bottom:25px;
}

.brand-logo{
    width:40px;
    height:40px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:#fff;

    color:#000;

    font-weight:1000;
}

.brand-title{
    font-size:15px;
    font-weight:950;
}

.brand-sub{
    margin-top:2px;

    color:#6f6f7d;

    font-size:9px;
}

.nav{
    display:flex;

    flex-direction:column;

    gap:5px;
}

.nav-button{
    width:100%;

    padding:12px;

    border:none;

    border-radius:13px;

    background:transparent;

    color:#858592;

    text-align:left;

    font-size:12px;

    font-weight:800;

    cursor:pointer;

    transition:
        background .15s ease,
        color .15s ease;
}

.nav-button:hover{
    background:rgba(255,255,255,.05);

    color:#fff;
}

.nav-button.active{
    background:rgba(255,255,255,.09);

    color:#fff;
}

.sidebar-profile{
    position:absolute;

    left:18px;
    right:18px;
    bottom:18px;

    display:flex;

    align-items:center;

    gap:9px;

    padding:10px;

    border-radius:15px;

    background:
        rgba(255,255,255,.045);
}

.sidebar-avatar{
    width:35px;
    height:35px;

    border-radius:50%;

    object-fit:cover;

    background:#222;
}

.sidebar-name{
    max-width:145px;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;

    font-size:11px;

    font-weight:900;
}

.sidebar-email{
    max-width:145px;

    margin-top:2px;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;

    color:#686875;

    font-size:8px;
}


/* =========================================================
   MAIN
========================================================= */

.main{
    width:100%;

    margin-left:250px;

    padding:25px;

    max-width:1600px;
}

.topbar{
    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-bottom:20px;
}

.page-title{
    font-size:23px;

    font-weight:1000;
}

.status{
    display:flex;

    align-items:center;

    gap:7px;

    color:#777783;

    font-size:10px;
}

.status-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#49ff8a;

    box-shadow:
        0 0 12px
        rgba(73,255,138,.75);
}


/* =========================================================
   MOBILE HEADER
========================================================= */

.mobile-top{
    display:none;
}


/* =========================================================
   PAGES
========================================================= */

.page{
    display:none;

    animation:
        pageIn .18s ease;
}

.page.active{
    display:block;
}

@keyframes pageIn{

    from{
        opacity:0;
        transform:translateY(4px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =========================================================
   HERO
========================================================= */

.hero{
    position:relative;

    overflow:hidden;

    padding:34px;

    border-radius:27px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.095),
            rgba(255,255,255,.025)
        );

    border:
        1px solid
        rgba(255,255,255,.08);
}

.hero::after{
    content:"";

    position:absolute;

    width:260px;
    height:260px;

    right:-90px;
    top:-100px;

    border-radius:50%;

    background:
        rgba(95,110,255,.16);

    filter:blur(35px);
}

.hero-content{
    position:relative;

    z-index:1;
}

.hero-small{
    color:#858592;

    font-size:11px;

    font-weight:800;

    letter-spacing:1px;
}

.hero-title{
    margin-top:6px;

    font-size:
        clamp(32px,5vw,55px);

    line-height:1.05;

    font-weight:1000;

    letter-spacing:-2.5px;
}

.hero-description{
    max-width:680px;

    margin-top:12px;

    color:#92929f;

    font-size:13px;

    line-height:1.6;
}

.hero-user{
    display:flex;

    align-items:center;

    gap:13px;

    margin-top:22px;
}

.hero-avatar{
    width:55px;
    height:55px;

    border-radius:50%;

    object-fit:cover;

    border:
        2px solid
        rgba(255,255,255,.16);
}

.hero-user-name{
    font-size:14px;

    font-weight:900;
}

.hero-user-email{
    margin-top:3px;

    color:#6f6f7b;

    font-size:10px;
}


/* =========================================================
   CARDS
========================================================= */

.card-grid{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(220px,1fr)
        );

    gap:14px;

    margin-top:15px;
}

.card{
    padding:20px;

    border-radius:21px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.07);

    transition:
        transform .15s ease,
        background .15s ease;
}

.card:hover{
    transform:translateY(-2px);

    background:
        rgba(255,255,255,.06);
}

.card-icon{
    font-size:24px;
}

.card-title{
    margin-top:12px;

    font-size:16px;

    font-weight:950;
}

.card-text{
    margin-top:7px;

    color:#858591;

    font-size:12px;

    line-height:1.55;
}

.primary{
    margin-top:15px;

    padding:11px 15px;

    border:none;

    border-radius:11px;

    background:#fff;

    color:#050507;

    font-size:11px;

    font-weight:950;

    cursor:pointer;
}


/* =========================================================
   AI
========================================================= */

.ai-box{
    margin-top:18px;

    overflow:hidden;

    border-radius:21px;

    background:
        rgba(0,0,0,.17);

    border:
        1px solid
        rgba(255,255,255,.07);
}

.ai-input-area{
    display:flex;

    gap:8px;

    padding:13px;
}

.ai-input{
    flex:1;

    min-width:0;

    padding:13px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:12px;

    outline:none;

    background:
        rgba(0,0,0,.25);

    color:#fff;

    font-size:12px;
}

.ai-send{
    padding:0 17px;

    border:none;

    border-radius:12px;

    background:#fff;

    color:#000;

    font-weight:950;
}

.ai-answer{
    min-height:100px;

    padding:17px;

    border-top:
        1px solid
        rgba(255,255,255,.07);

    color:#bdbdc8;

    font-size:12px;

    line-height:1.6;
}

.processing{
    color:#858592;

    animation:
        pulse 1s infinite;
}

@keyframes pulse{

    50%{
        opacity:.35;
    }

}

.code-box{
    position:relative;

    overflow:hidden;

    margin-top:13px;

    border-radius:14px;

    background:#030305;

    border:
        1px solid
        rgba(255,255,255,.06);
}

.code-copy{
    position:absolute;

    right:8px;
    top:8px;

    padding:6px 9px;

    border:none;

    border-radius:8px;

    background:#fff;

    color:#000;

    font-size:9px;

    font-weight:950;
}

pre{
    padding:18px;

    padding-top:40px;

    overflow:auto;

    font-family:
        monospace;

    font-size:10px;

    line-height:1.55;
}


/* =========================================================
   USERS
========================================================= */

.users-list{
    display:grid;

    gap:9px;

    margin-top:17px;
}

.user-row{
    display:flex;

    align-items:center;

    gap:11px;

    padding:12px;

    border-radius:16px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.06);
}

.user-avatar{
    width:42px;
    height:42px;

    border-radius:50%;

    object-fit:cover;

    background:#222;
}

.user-name{
    font-size:12px;

    font-weight:900;
}

.user-time{
    margin-top:3px;

    color:#666673;

    font-size:9px;
}

.online{
    margin-left:auto;

    color:#48ff89;

    font-size:8px;

    font-weight:900;
}


/* =========================================================
   CHAT
========================================================= */

.chat-box{
    height:420px;

    overflow-y:auto;

    margin-top:15px;

    padding:15px;

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius:
        19px 19px 0 0;

    background:
        rgba(0,0,0,.16);
}

.chat-message{
    display:flex;

    gap:9px;

    margin-bottom:14px;
}

.chat-avatar{
    flex:none;

    width:31px;
    height:31px;

    border-radius:50%;

    object-fit:cover;
}

.chat-content{
    max-width:85%;
}

.chat-name{
    font-size:10px;

    font-weight:900;
}

.chat-text{
    margin-top:3px;

    color:#aaaab6;

    font-size:11px;

    line-height:1.5;

    word-break:break-word;
}

.chat-input{
    display:flex;

    gap:8px;

    padding:11px;

    border:
        1px solid
        rgba(255,255,255,.07);

    border-top:none;

    border-radius:
        0 0 19px 19px;

    background:
        rgba(255,255,255,.035);
}

.chat-input input{
    flex:1;

    min-width:0;

    padding:12px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:11px;

    outline:none;

    background:
        rgba(0,0,0,.25);

    color:#fff;

    font-size:11px;
}

.chat-input button{
    padding:0 16px;

    border:none;

    border-radius:11px;

    background:#fff;

    color:#000;

    font-weight:950;
}


/* =========================================================
   PROFILE
========================================================= */

.profile-card{
    max-width:720px;
}

.profile-head{
    display:flex;

    align-items:center;

    gap:16px;
}

.profile-avatar{
    width:78px;
    height:78px;

    border-radius:50%;

    object-fit:cover;

    border:
        2px solid
        rgba(255,255,255,.13);
}

.profile-name{
    font-size:21px;

    font-weight:1000;
}

.profile-email{
    margin-top:4px;

    color:#70707c;

    font-size:10px;
}

.profile-item{
    margin-top:16px;

    padding:15px;

    border-radius:15px;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid
        rgba(255,255,255,.06);
}

.profile-label{
    color:#6d6d79;

    font-size:9px;

    text-transform:uppercase;

    letter-spacing:1px;
}

.profile-value{
    margin-top:5px;

    font-size:13px;

    font-weight:850;

    word-break:break-word;
}

.logout{
    width:100%;

    min-height:48px;

    margin-top:17px;

    border:none;

    border-radius:13px;

    background:#ff4d63;

    color:#fff;

    font-weight:950;

    cursor:pointer;
}


/* =========================================================
   KITS
========================================================= */

.kit-id{
    margin-top:12px;

    padding:11px;

    border-radius:11px;

    background:#030305;

    font-family:monospace;

    font-size:10px;

    word-break:break-all;
}

.kit-copy{
    margin-top:9px;

    padding:9px 12px;

    border:none;

    border-radius:9px;

    background:#fff;

    color:#000;

    font-size:10px;

    font-weight:950;
}


/* =========================================================
   STUDIO
========================================================= */

.studio-card{
    max-width:800px;
}

.studio-button{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    margin-top:17px;

    padding:13px 17px;

    border-radius:12px;

    background:#fff;

    color:#000;

    text-decoration:none;

    font-size:12px;

    font-weight:950;
}

.notice{
    margin-top:15px;

    padding:13px;

    border-radius:13px;

    background:
        rgba(255,190,70,.06);

    border:
        1px solid
        rgba(255,190,70,.12);

    color:#97918a;

    font-size:10px;

    line-height:1.55;
}


/* =========================================================
   DEVELOPMENT
========================================================= */

.country-select{
    width:100%;

    margin-top:16px;

    padding:13px;

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius:12px;

    outline:none;

    background:#111219;

    color:#fff;

    font-size:12px;
}


/* =========================================================
   TOAST
========================================================= */

#toast{
    position:fixed;

    left:50%;
    bottom:25px;

    z-index:999999;

    max-width:
        calc(100% - 30px);

    padding:11px 15px;

    border-radius:12px;

    background:#fff;

    color:#000;

    font-size:10px;

    font-weight:950;

    opacity:0;

    pointer-events:none;

    transform:
        translate(-50%,15px);

    transition:
        opacity .2s ease,
        transform .2s ease;
}

#toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

    .sidebar{
        top:auto;
        bottom:0;
        left:0;
        right:0;

        width:100%;
        height:65px;

        padding:6px 7px;

        border-right:none;

        border-top:
            1px solid
            rgba(255,255,255,.08);
    }

    .brand,
    .sidebar-profile{
        display:none;
    }

    .nav{
        width:100%;
        height:100%;

        flex-direction:row;

        justify-content:space-around;

        gap:2px;
    }

    .nav-button{
        flex:1;

        padding:8px 2px;

        text-align:center;

        font-size:8px;

        border-radius:10px;
    }

    .main{
        margin-left:0;

        padding:14px;

        padding-bottom:82px;
    }

    .topbar{
        display:none;
    }

    .mobile-top{
        display:flex;

        align-items:center;
        justify-content:space-between;

        margin-bottom:14px;
    }

    .mobile-brand{
        font-size:15px;

        font-weight:1000;
    }

    .mobile-avatar{
        width:34px;
        height:34px;

        border-radius:50%;

        object-fit:cover;
    }

    .hero{
        padding:23px;

        border-radius:22px;
    }

    .hero-title{
        font-size:34px;
    }

    .hero-description{
        font-size:12px;
    }

    .card-grid{
        grid-template-columns:1fr;
    }

    .chat-box{
        height:380px;
    }

}


/* =========================================================
   LIGHT MODE
========
