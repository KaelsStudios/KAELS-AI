<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#07070a">
<meta name="description"
      content="KAEL ASSISTANT - Roblox AI, Kits, Development and Community">

<title>KAEL ASSISTANT</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background:#07070a;
    color:#fff;
}

body{
    overflow-x:hidden;
}

/* =========================
   BACKGROUND
========================= */

#background{
    position:fixed;
    inset:0;
    z-index:-5;
    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(100,100,255,.14),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(0,220,255,.10),
            transparent 35%
        ),
        #07070a;
}

.bg-white{
    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(80,100,255,.12),
            transparent 35%
        ),
        #f5f7fb;
}

.bg-purple{
    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(180,70,255,.18),
            transparent 35%
        ),
        #08060d;
}

.bg-blue{
    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(0,130,255,.18),
            transparent 35%
        ),
        #05090f;
}

/* =========================
   WELCOME
========================= */

#welcome{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:rgba(0,0,0,.70);
    transition:
        opacity .45s ease,
        visibility .45s ease;
}

#welcome.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.welcome-card{
    width:min(480px,100%);
    padding:36px 28px;
    text-align:center;
    border-radius:28px;
    background:rgba(15,15,22,.82);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:
        0 30px 100px rgba(0,0,0,.55);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
}

.welcome-title{
    font-size:clamp(30px,8vw,52px);
    font-weight:900;
    letter-spacing:-2px;
    text-shadow:
        2px 2px 0 #000,
        -2px -2px 0 #000;
}

.welcome-sub{
    margin-top:10px;
    color:#b6b6c7;
    font-size:15px;
}

.welcome-name{
    margin-top:8px;
    font-weight:800;
    font-size:18px;
}

#skipWelcome{
    margin-top:28px;
    width:100%;
    min-height:50px;
    border:none;
    border-radius:15px;
    background:#fff;
    color:#050507;
    font-weight:900;
    font-size:15px;
    cursor:pointer;
}

/* =========================
   LOGIN
========================= */

#authScreen{
    min-height:100vh;
    display:none;
    justify-content:center;
    align-items:center;
    padding:22px;
}

#authScreen.show{
    display:flex;
}

.auth-card{
    width:min(460px,100%);
    padding:32px 25px;
    border-radius:28px;
    background:rgba(15,15,22,.84);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:
        0 30px 100px rgba(0,0,0,.45);
    backdrop-filter:blur(22px);
}

.logo{
    width:64px;
    height:64px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:20px;
    background:#fff;
    color:#050507;
    font-size:25px;
    font-weight:1000;
}

.auth-title{
    margin-top:22px;
    text-align:center;
    font-size:29px;
    font-weight:950;
}

.auth-description{
    margin-top:9px;
    text-align:center;
    color:#9b9baa;
    line-height:1.5;
    font-size:14px;
}

.google-button{
    width:100%;
    margin-top:25px;
    min-height:54px;
    border:none;
    border-radius:16px;
    background:#fff;
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    font-weight:900;
    cursor:pointer;
    transition:transform .15s ease;
}

.google-button:active{
    transform:scale(.98);
}

.google-icon{
    width:22px;
    height:22px;
}

/* =========================
   APP
========================= */

#app{
    display:none;
    min-height:100vh;
}

#app.show{
    display:block;
}

.app-layout{
    width:100%;
    max-width:1500px;
    margin:auto;
    display:flex;
    min-height:100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:250px;
    padding:18px;
    background:rgba(9,9,13,.80);
    border-right:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    z-index:100;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
    padding:9px;
    margin-bottom:25px;
}

.brand-logo{
    width:40px;
    height:40px;
    border-radius:13px;
    background:#fff;
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:1000;
}

.brand-text{
    font-weight:950;
    font-size:16px;
}

.brand-sub{
    color:#777786;
    font-size:10px;
    margin-top:2px;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.nav-button{
    width:100%;
    border:none;
    background:transparent;
    color:#8e8e9d;
    text-align:left;
    padding:12px 13px;
    border-radius:13px;
    cursor:pointer;
    font-size:13px;
    font-weight:750;
    transition:
        background .18s ease,
        color .18s ease;
}

.nav-button:hover{
    background:rgba(255,255,255,.06);
    color:#fff;
}

.nav-button.active{
    background:rgba(255,255,255,.10);
    color:#fff;
}

.sidebar-profile{
    position:absolute;
    left:18px;
    right:18px;
    bottom:18px;
    padding:10px;
    border-radius:16px;
    background:rgba(255,255,255,.05);
    display:flex;
    align-items:center;
    gap:9px;
}

.sidebar-avatar{
    width:35px;
    height:35px;
    border-radius:50%;
    object-fit:cover;
    background:#222;
}

.sidebar-user{
    min-width:0;
}

.sidebar-name{
    font-size:12px;
    font-weight:850;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.sidebar-email{
    color:#737381;
    font-size:9px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================
   MAIN
========================= */

.main{
    width:100%;
    margin-left:250px;
    padding:25px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.page-title{
    font-size:23px;
    font-weight:950;
}

.status{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:11px;
    color:#888896;
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#4cff91;
    box-shadow:0 0 12px rgba(76,255,145,.7);
}

/* =========================
   PAGE
========================= */

.page{
    display:none;
    animation:pageIn .25s ease;
}

.page.active{
    display:block;
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:translateY(5px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   HERO
========================= */

.hero{
    position:relative;
    overflow:hidden;
    padding:34px;
    border-radius:28px;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.10),
            rgba(255,255,255,.035)
        );
    border:1px solid rgba(255,255,255,.09);
}

.hero::after{
    content:"";
    position:absolute;
    width:250px;
    height:250px;
    right:-80px;
    top:-100px;
    border-radius:50%;
    background:rgba(100,120,255,.16);
    filter:blur(35px);
}

.hero-content{
    position:relative;
    z-index:1;
}

.hero-small{
    color:#92929f;
    font-size:12px;
}

.hero-title{
    margin-top:5px;
    font-size:clamp(31px,5vw,56px);
    font-weight:1000;
    letter-spacing:-2px;
}

.hero-description{
    max-width:650px;
    margin-top:12px;
    color:#a5a5b2;
    line-height:1.55;
}

.hero-user{
    margin-top:23px;
    display:flex;
    align-items:center;
    gap:13px;
}

.hero-avatar{
    width:55px;
    height:55px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid rgba(255,255,255,.2);
}

.hero-user-name{
    font-size:15px;
    font-weight:900;
}

.hero-user-email{
    color:#777784;
    font-size:11px;
    margin-top:3px;
}

/* =========================
   GRID
========================= */

.card-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));
    gap:14px;
    margin-top:15px;
}

.card{
    padding:20px;
    border-radius:22px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.075);
    transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease;
}

.card:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.065);
    border-color:rgba(255,255,255,.14);
}

.card-icon{
    font-size:25px;
}

.card-title{
    margin-top:13px;
    font-size:16px;
    font-weight:900;
}

.card-text{
    margin-top:7px;
    color:#898995;
    line-height:1.5;
    font-size:12px;
}

.primary{
    margin-top:15px;
    border:none;
    background:#fff;
    color:#08080a;
    padding:11px 16px;
    border-radius:12px;
    font-weight:900;
    cursor:pointer;
}

/* =========================
   AI
========================= */

.ai-box{
    border-radius:24px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    overflow:hidden;
}

.ai-input-area{
    padding:16px;
    display:flex;
    gap:9px;
}

.ai-input{
    flex:1;
    min-width:0;
    background:rgba(0,0,0,.25);
    border:1px solid rgba(255,255,255,.08);
    color:#fff;
    outline:none;
    border-radius:13px;
    padding:13px;
}

.ai-send{
    border:none;
    padding:0 18px;
    border-radius:13px;
    background:#fff;
    color:#000;
    font-weight:900;
}

.ai-answer{
    padding:18px;
    border-top:1px solid rgba(255,255,255,.07);
    min-height:100px;
    color:#c4c4ce;
    line-height:1.6;
    font-size:13px;
}

.processing{
    color:#8e8e9a;
    animation:pulse 1.1s infinite;
}

@keyframes pulse{
    50%{
        opacity:.35;
    }
}

.code-box{
    margin-top:13px;
    position:relative;
    background:#050506;
    border:1px solid rgba(255,255,255,.07);
    border-radius:15px;
    overflow:hidden;
}

.code-copy{
    position:absolute;
    right:9px;
    top:9px;
    border:none;
    background:#fff;
    color:#000;
    border-radius:8px;
    padding:6px 9px;
    font-size:10px;
    font-weight:900;
}

pre{
    padding:18px;
    padding-top:43px;
    overflow:auto;
    font-size:11px;
    line-height:1.55;
}

/* =========================
   USERS
========================= */

.users-list{
    display:grid;
    gap:10px;
}

.user-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px;
    border-radius:17px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.07);
}

.user-avatar{
    width:43px;
    height:43px;
    border-radius:50%;
    object-fit:cover;
    background:#222;
}

.user-name{
    font-weight:850;
    font-size:13px;
}

.user-time{
    color:#70707d;
    font-size:10px;
    margin-top:3px;
}

.online{
    margin-left:auto;
    font-size:9px;
    color:#4cff91;
}

/* =========================
   PROFILE
========================= */

.profile-card{
    max-width:700px;
}

.profile-head{
    display:flex;
    align-items:center;
    gap:17px;
}

.profile-avatar{
    width:80px;
    height:80px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid rgba(255,255,255,.12);
}

.profile-name{
    font-size:22px;
    font-weight:950;
}

.profile-email{
    color:#777784;
    font-size:12px;
    margin-top:4px;
}

.profile-item{
    margin-top:18px;
    padding:16px;
    border-radius:16px;
    background:rgba(255,255,255,.045);
}

.profile-label{
    color:#777784;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.profile-value{
    margin-top:5px;
    font-size:14px;
    font-weight:800;
}

.logout{
    width:100%;
    margin-top:18px;
    min-height:48px;
    border:none;
    border-radius:13px;
    background:#ff4f64;
    color:#fff;
    font-weight:900;
}

/* =========================
   KIT
========================= */

.kit-id{
    margin-top:13px;
    padding:12px;
    border-radius:12px;
    background:#050506;
    font-family:monospace;
    font-size:11px;
    word-break:break-all;
}

.kit-copy{
    margin-top:10px;
    border:none;
    padding:9px 13px;
    border-radius:10px;
    background:#fff;
    color:#000;
    font-weight:900;
}

/* =========================
   CHAT
========================= */

.chat-box{
    height:420px;
    overflow-y:auto;
    padding:15px;
    border-radius:20px 20px 0 0;
    background:rgba(0,0,0,.18);
    border:1px solid rgba(255,255,255,.07);
}

.chat-message{
    display:flex;
    gap:9px;
    margin-bottom:13px;
}

.chat-avatar{
    width:31px;
    height:31px;
    border-radius:50%;
    object-fit:cover;
}

.chat-content{
    max-width:85%;
}

.chat-name{
    font-size:10px;
    font-weight:900;
}

.chat-text{
    margin-top:3px;
    color:#b4b4c0;
    font-size:12px;
    line-height:1.4;
    word-break:break-word;
}

.chat-input{
    display:flex;
    gap:8px;
    padding:12px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.07);
    border-top:none;
    border-radius:0 0 20px 20px;
}

.chat-input input{
    flex:1;
    min-width:0;
    background:rgba(0,0,0,.25);
    color:#fff;
    border:1px solid rgba(255,255,255,.08);
    outline:none;
    border-radius:12px;
    padding:12px;
}

.chat-input button{
    border:none;
    background:#fff;
    color:#000;
    padding:0 17px;
    border-radius:12px;
    font-weight:900;
}

/* =========================
   STUDIO
========================= */

.studio-card{
    max-width:800px;
}

.studio-button{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-top:17px;
    padding:13px 17px;
    border-radius:13px;
    background:#fff;
    color:#000;
    text-decoration:none;
    font-size:13px;
    font-weight:900;
}

.notice{
    margin-top:15px;
    padding:14px;
    border-radius:14px;
    background:rgba(255,190,70,.07);
    border:1px solid rgba(255,190,70,.14);
    color:#aaa29a;
    font-size:11px;
    line-height:1.5;
}

/* =========================
   MOBILE
========================= */

.mobile-top{
    display:none;
}

@media(max-width:800px){

    .sidebar{
        width:100%;
        height:66px;
        top:auto;
        bottom:0;
        left:0;
        right:0;
        padding:7px 8px;
        border-right:none;
        border-top:1px solid rgba(255,255,255,.08);
        z-index:500;
    }

    .brand,
    .sidebar-profile{
        display:none;
    }

    .nav{
        width:100%;
        height:100%;
        flex-direction:row;
        justify-content:space-around;
        gap:2px;
    }

    .nav-button{
        flex:1;
        text-align:center;
        padding:9px 3px;
        font-size:9px;
        border-radius:11px;
    }

    .main{
        margin-left:0;
        padding:15px;
        padding-bottom:85px;
    }

    .mobile-top{
        display:flex;
        align-items:center;
        justify-content:space-between;
        margin-bottom:15px;
    }

    .mobile-brand{
        font-weight:950;
        font-size:16px;
    }

    .mobile-mini-avatar{
        width:34px;
        height:34px;
        border-radius:50%;
        object-fit:cover;
    }

    .hero{
        padding:23px;
        border-radius:23px;
    }

    .hero-title{
        font-size:35px;
    }

    .topbar{
        display:none;
    }

    .card-grid{
        grid-template-columns:1fr;
    }

    .chat-box{
        height:380px;
    }
}

/* =========================
   LIGHT
========================= */

.light-mode{
    color:#111;
}

.light-mode .sidebar{
    background:rgba(255,255,255,.78);
    border-color:rgba(0,0,0,.08);
}

.light-mode .brand-sub,
.light-mode .sidebar-email,
.light-mode .status,
.light-mode .hero-small,
.light-mode .hero-description,
.light-mode .card-text,
.light-mode .user-time,
.light-mode .profile-email,
.light-mode .profile-label,
.light-mode .notice{
    color:#666;
}

.light-mode .nav-button{
    color:#666;
}

.light-mode .nav-button.active,
.light-mode .nav-button:hover{
    color:#111;
    background:rgba(0,0,0,.07);
}

.light-mode .hero,
.light-mode .card,
.light-mode .ai-box,
.light-mode .user-row,
.light-mode .profile-item{
    background:rgba(255,255,255,.72);
    border-color:rgba(0,0,0,.08);
}

.light-mode .ai-input,
.light-mode .chat-input input{
    background:#fff;
    color:#111;
    border-color:rgba(0,0,0,.12);
}

.light-mode .chat-text,
.light-mode .ai-answer{
    color:#444;
}

.light-mode .chat-box{
    background:rgba(0,0,0,.03);
}

/* =========================
   TOAST
========================= */

#toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:
        translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    z-index:99999;
    padding:11px 15px;
    border-radius:12px;
    background:#fff;
    color:#000;
    font-size:11px;
    font-weight:900;
    transition:
        opacity .2s ease,
        transform .2s ease;
}

#toast.show{
    opacity:1;
    transform:translate(-50%,0);
}
</style>
</head>

<body>

<div id="background"></div>

<!-- =========================
     WELCOME
========================= -->

<section id="welcome">

    <div class="welcome-card">

        <div class="welcome-title">
            Selamat Datang
        </div>

        <div class="welcome-sub">
            Selamat datang di
        </div>

        <div class="welcome-name">
            KAEL ASSISTANT
        </div>

        <button id="skipWelcome">
            [ Skip ]
        </button>

    </div>

</section>


<!-- =========================
     AUTH
========================= -->

<section id="authScreen">

    <div class="auth-card">

        <div class="logo">
            K
        </div>

        <div class="auth-title">
            KAEL ASSISTANT
        </div>

        <div class="auth-description">
            Login menggunakan Google Account kamu.
            Tidak perlu membuat password tambahan.
        </div>

        <button
            id="googleLogin"
            class="google-button">

            <svg
                class="google-icon"
                viewBox="0 0 24 24">

                <path
                    fill="#4285F4"
                    d="M21.35 12.27c0-.73-.06-1.43-.18-2.09H12v3.95h5.24a4.48 4.48 0 0 1-1.95 2.94v2.45h3.15c1.84-1.69 2.91-4.18 2.91-7.25z"/>

                <path
                    fill="#34A853"
                    d="M12 21.72c2.63 0 4.84-.87 6.45-2.36l-3.15-2.45c-.87.58-1.98.92-3.3.92-2.54 0-4.7-1.72-5.47-4.03H3.27v2.53A9.75 9.75 0 0 0 12 21.72z"/>

                <path
                    fill="#FBBC05"
                    d="M6.53 13.8a5.86 5.86 0 0 1 0-3.6V7.67H3.27a9.76 9.76 0 0 0 0 8.66l3.26-2.53z"/>
