<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>KAEL ASSISTANT</title>

<style>

/* =====================================================
RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f5f7;
    color:#111;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}


/* =====================================================
WELCOME
===================================================== */

#welcomeScreen{
    position:fixed;
    inset:0;
    z-index:999999;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.70);

    color:white;

    transition:.4s ease;
}

#welcomeScreen.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.welcomeBox{
    width:92%;
    max-width:500px;
    text-align:center;
}

.welcomeAvatar{
    width:105px;
    height:105px;

    border-radius:50%;

    object-fit:cover;

    border:4px solid white;

    margin-bottom:18px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.5);
}

.welcomeTitle{
    font-size:38px;
    font-weight:900;

    color:#000;

    -webkit-text-stroke:2px white;

    text-shadow:
        0 5px 15px rgba(0,0,0,.6);
}

.welcomeUsername{
    margin-top:9px;

    font-size:19px;
    font-weight:800;
}

.welcomeSub{
    margin-top:5px;
    color:#ddd;
}

#skipWelcome{
    position:absolute;

    right:20px;
    bottom:20px;

    padding:13px 24px;

    border-radius:13px;

    background:white;
    color:#111;

    font-weight:900;

    box-shadow:
        0 8px 25px rgba(0,0,0,.35);
}


/* =====================================================
AUTH SCREEN
===================================================== */

#authScreen{
    position:fixed;
    inset:0;
    z-index:99998;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:#f5f5f7;
}

#authScreen.show{
    display:flex;
}

.authCard{
    width:100%;
    max-width:430px;

    background:white;

    border-radius:25px;

    padding:28px 22px;

    box-shadow:
        0 20px 70px rgba(0,0,0,.14);
}

.authLogo{
    width:75px;
    height:75px;

    display:block;

    margin:0 auto 14px;

    border-radius:18px;
}

.authTitle{
    text-align:center;

    font-size:29px;
    font-weight:900;
}

.authSubtitle{
    text-align:center;

    color:#777;

    margin-top:7px;
    margin-bottom:22px;
}

.authTabs{
    display:flex;
    gap:7px;

    margin-bottom:18px;
}

.authTab{
    flex:1;

    height:43px;

    border-radius:11px;

    background:#eee;

    color:#555;

    font-weight:900;
}

.authTab.active{
    background:#111;
    color:white;
}

.authForm{
    display:none;
}

.authForm.active{
    display:block;
}

.authInput{
    width:100%;
    height:48px;

    border:1px solid #d8d8d8;

    border-radius:12px;

    padding:0 13px;

    outline:none;

    margin-bottom:10px;

    background:white;
    color:#111;
}

.authInput:focus{
    border-color:#111;
}

.authMainButton{
    width:100%;
    height:49px;

    border-radius:12px;

    background:#111;
    color:white;

    font-weight:900;

    margin-top:4px;
}

.authInfo{
    font-size:11px;

    line-height:1.5;

    color:#888;

    margin-top:13px;

    text-align:center;
}


/* =====================================================
APP
===================================================== */

#app{
    display:none;

    position:fixed;
    inset:0;

    overflow:hidden;
}

#app.show{
    display:block;
}

#app.white{
    background:#f5f5f7;
    color:#111;
}

#app.dark{
    background:#101114;
    color:white;
}

#app.purple{
    background:
        linear-gradient(
            135deg,
            #f0e4ff,
            #ffffff
        );

    color:#111;
}

#app.blue{
    background:
        linear-gradient(
            135deg,
            #dceeff,
            #ffffff
        );

    color:#111;
}


/* =====================================================
SIDEBAR
===================================================== */

.sidebar{
    position:absolute;

    top:0;
    left:0;
    bottom:0;

    width:250px;

    padding:15px 12px;

    background:
        rgba(255,255,255,.94);

    backdrop-filter:blur(20px);

    border-right:1px solid #ddd;

    z-index:100;
}

.dark .sidebar{
    background:#141519;
    border-color:#292a2f;
}

.logoArea{
    display:flex;

    align-items:center;

    gap:10px;

    padding:8px;

    margin-bottom:15px;
}

.logoArea img{
    width:42px;
    height:42px;

    border-radius:12px;
}

.logoArea span{
    font-weight:900;
    font-size:17px;
}

.sideBtn{
    width:100%;
    height:45px;

    margin-bottom:5px;

    border-radius:12px;

    padding:0 13px;

    background:transparent;

    color:inherit;

    text-align:left;

    font-weight:800;
}

.sideBtn.active{
    background:#111;
    color:white;
}

.dark .sideBtn.active{
    background:white;
    color:#111;
}


/* =====================================================
MAIN
===================================================== */

.main{
    position:absolute;

    top:0;
    right:0;
    bottom:0;
    left:250px;

    overflow:hidden;
}

.page{
    display:none;

    width:100%;
    height:100%;

    overflow-y:auto;

    padding:30px;
    padding-bottom:100px;
}

.page.active{
    display:block;
}

.pageTitle{
    font-size:30px;
    font-weight:900;
}

.pageDesc{
    margin-top:6px;
    margin-bottom:24px;

    color:#777;
}

.dark .pageDesc{
    color:#aaa;
}


/* =====================================================
HOME
===================================================== */

.hero{
    min-height:240px;

    padding:30px;

    border-radius:25px;

    background:#111;

    color:white;

    display:flex;
    flex-direction:column;
    justify-content:center;

    box-shadow:
        0 15px 40px rgba(0,0,0,.12);
}

.hero h1{
    font-size:35px;
    font-weight:900;
}

.hero p{
    margin-top:9px;
    color:#bbb;
}

.homeGrid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:15px;

    margin-top:18px;
}

.homeCard{
    min-height:125px;

    padding:20px;

    text-align:left;

    border-radius:20px;

    background:white;

    border:1px solid #ddd;

    color:#111;
}

.dark .homeCard{
    background:#1a1b20;
    border-color:#2b2c31;
    color:white;
}

.homeCard:active{
    transform:scale(.98);
}

.homeCard h3{
    font-size:18px;
}

.homeCard p{
    color:#777;

    margin-top:7px;

    line-height:1.4;
}


/* =====================================================
AI
===================================================== */

.aiLayout{
    height:calc(100vh - 60px);

    display:grid;

    grid-template-columns:245px 1fr;

    gap:15px;
}

.conversationPanel{
    height:100%;

    background:white;

    border:1px solid #ddd;

    border-radius:20px;

    padding:12px;

    display:flex;

    flex-direction:column;

    overflow:hidden;
}

.dark .conversationPanel{
    background:#18191e;
    border-color:#2a2b30;
}

.newConversation{
    width:100%;
    height:46px;

    border-radius:12px;

    background:#111;
    color:white;

    font-weight:900;

    margin-bottom:10px;
}

.dark .newConversation{
    background:white;
    color:#111;
}

.conversationTitle{
    padding:7px 5px 9px;

    color:#777;

    font-size:12px;

    font-weight:900;

    text-transform:uppercase;
}

.conversationList{
    flex:1;

    overflow-y:auto;
}

.conversationItem{
    position:relative;

    width:100%;

    min-height:50px;

    padding:9px 35px 9px 10px;

    margin-bottom:5px;

    border-radius:11px;

    background:transparent;

    color:inherit;

    text-align:left;
}

.conversationItem.active,
.conversationItem:hover{
    background:#eee;
}

.dark .conversationItem.active,
.dark .conversationItem:hover{
    background:#292a30;
}

.conversationName{
    font-size:13px;
    font-weight:800;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}

.deleteConversation{
    position:absolute;

    right:7px;
    top:50%;

    transform:translateY(-50%);

    width:25px;
    height:25px;

    border-radius:7px;

    background:transparent;

    color:#999;
}

.deleteConversation:hover{
    background:#ddd;
    color:#111;
}

.chatPanel{
    min-width:0;

    height:100%;

    display:flex;

    flex-direction:column;
}

.chatHeader{
    min-height:50px;

    display:flex;

    align-items:center;

    gap:10px;

    font-weight:900;
}

#currentConversationTitle{
    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}

.aiMessages{
    flex:1;

    overflow-y:auto;

    padding:10px 5px 20px;
}

.messageRow{
    display:flex;

    margin-bottom:17px;
}

.messageRow.user{
    justify-content:flex-end;
}

.messageBubble{
    max-width:82%;

    padding:14px 16px;

    border-radius:18px;

    line-height:1.55;

    white-space:pre-wrap;

    background:#e9e9eb;

    color:#111;
}

.dark .messageBubble{
    background:#202126;
    color:white;
}

.messageRow.user .messageBubble{
    background:#111;
    color:white;
}

.dark .messageRow.user .messageBubble{
    background:white;
    color:#111;
}

.processing{
    color:#777;
    font-style:italic;
}

.codeContainer{
    width:min(850px,85%);
}

.codeTitle{
    margin-bottom:7px;

    font-weight:900;
}

.codeBlock{
    background:#090909;

    color:white;

    border-radius:12px;

    padding:14px;

    overflow-x:auto;

    white-space:pre;

    font-family:monospace;

    font-size:12px;
}

.copyButton{
    margin-top:8px;

    padding:8px 12px;

    border-radius:8px;

    background:white;

    color:#111;

    font-weight:800;

    font-size:12px;
}

.chatComposer{
    display:flex;

    gap:8px;

    padding:10px 0;
}

#aiInput{
    flex:1;

    min-height:52px;
    max-height:140px;

    resize:none;

    border:1px solid #d5d5d5;

    border-radius:15px;

    padding:14px;

    outline:none;

    background:white;

    color:#111;
}

#sendAI{
    width:54px;

    border-radius:15px;

    background:#111;

    color:white;

    font-size:19px;
}

.dark #sendAI{
    background:white;
    color:#111;
}


/* =====================================================
KITS
===================================================== */

.kitGrid{
    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(240px,1fr));

    gap:15px;
}

.kitCard{
    background:white;

    border:1px solid #ddd;

    border-radius:20px;

    padding:20px;
}

.dark .kitCard{
    background:#191a1f;
    border-color:#2b2c31;
}

.kitCard h3{
    font-size:17px;
}

.kitCard p{
    color:#777;

    margin-top:7px;
}

.kitId{
    margin-top:15px;

    padding:11px;

    background:#eee;

    border-radius:10px;

    font-family:monospace;

    font-size:12px;
}

.dark .kitId{
    background:#101114;
}

.smallBtn{
    margin-top:10px;

    height:40px;

    padding:0 15px;

    border-radius:10px;

    background:#111;

    color:white;

    font-weight:800;
}


/* =====================================================
USERS
===================================================== */

.userGrid{
    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(230px,1fr));

    gap:12px;
}

.userCard{
    display:flex;

    align-items:center;

    gap:12px;

    padding:15px;

    border-radius:18px;

    background:white;

    border:1px solid #ddd;
}

.dark .userCard{
    background:#191a1f;
    border-color:#2b2c31;
}

.userAvatar{
    width:48px;
    height:48px;

    border-radius:50%;
}

.userStatus{
    color:#777;

    font-size:12px;

    margin-top:3px;
}


/* =====================================================
DEVELOPMENT
===================================================== */

.devGrid{
    display:grid;

    grid-template-columns:230px 1fr;

    gap:15px;
}

.devBox{
    background:white;

    border:1px solid #ddd;

    border-radius:20px;

    padding:20px;
}

.dark .devBox{
    background:#191a1f;
    border-color:#2b2c31;
}

.countrySelect{
    width:100%;

    height:45px;

    border-radius:10px;

    border:1px solid #ddd;

    padding:0 10px;
}

.globalChat{
    height:400px;

    overflow-y:auto;
}

.chatLine{
    padding:10px 0;

    border-bottom:1px solid #eee;
}

.dark .chatLine{
    border-color:#2a2b30;
}

.chatAuthor{
    font-weight:900;
    font-size:13px;
}

.chatCountry{
    color:#777;
    font-size:11px;
}

.chatText{
    margin-top:4px;
}

.chatSend{
    display:flex;

    gap:7px;

    margin-top:10px;
}

#globalChatInput{
    flex:1;

    height:45px;

    border:1px solid #ddd;

    border-radius:11px;

    padding:0 12px;
}

#sendGlobalChat{
    width:75px;

    border-radius:11px;

    background:#111;

    color:white;

    font-weight:800;
}


/* =====================================================
PROFILE
===================================================== */

.profileBox{
    max-width:560px;

    background:white;

    border:1px solid #ddd;

    border-radius:23px;

    padding:25px;
}

.dark .profileBox{
    background:#191a1f;
    border-color:#2b2c31;
}

.profileAvatar{
    width:90px;
    height:90px;

    border-radius:50%;
}

.profileDisplay{
    font-size:25px;

    font-weight:900;

    margin-top:12px;
}

.profileInfo{
    color:#777;

    margin-top:4px;
}

.profileInput{
    width:100%;

    height:46px;

    margin-top:20px;

    border:1px solid #ddd;

    border-radius:11px;

    padding:0 12px;
}

.profileAction{
    margin-top:10px;

    height:45px;

    padding:0 17px;

    border-radius:11px;

    background:#111;

    color:white;

    font-weight:900;
}


/* =====================================================
SETTINGS
===================================================== */

.settingsBox{
    max-width:600px;

    background:white;

    border:1px solid #ddd;

    border-radius:23px;

    padding:20px;
}

.dark .settingsBox{
    background:#191a1f;
    border-color:#2b2c31;
}

.settingRow{
    padding:15px 0;

    border-bottom:1px solid #eee;
}

.dark .settingRow{
    border-color:#292a30;
}

.settingLabel{
    font-weight:900;

    margin-bottom:10px;
}

.bgButtons{
    display:flex;

    flex-wrap:wrap;

    gap:8px;
}

.bgBtn{
    padding:10px 14px;

    border-radius:10px;

    background:#eee;

    color:#111;

    font-weight:800;
}

.logoutBtn{
    width:100%;

    height:48px;

    margin-top:20px;

    border-radius:12px;

    background:#111;

    color:white;

    font-weight:900;
}


/* =====================================================
MOBILE NAV
===================================================== */

.mobileNav{
    display:none;

    position:fixed;

    z-index:999;

    left:9px;
    right:9px;
    bottom:9px;

    height:65px;

    border-radius:20px;

    background:
        rgba(255,255,255,.95);

    backdrop-filter:blur(20px);

    box-shadow:
        0 10px 35px rgba(0,0,0,.2);

    justify-content:space-around;

    align-items:center;
}

.dark .mobileNav{
    background:
        rgba(25,26,31,.96);
}

.mobileNav button{
    width:18%;

    height:53px;

    border-radius:13px;

    background:transparent;

    color:#777;

    font-size:10px;

    font-weight:900;
}

.mobileNav button.active{
    background:#111;
    color:white;
}

.dark .mobileNav button.active{
    background:white;
    color:#111;
}


/* =====================================================
TOAST
===================================================== */

#toast{
    position:fixed;

    left:50%;
    bottom:85px;

    z-index:9999999;

    transform:
        translateX(-50%)
        translateY(20px);

    opacity:0;

    pointer-events:none;

    max-width:90%;

    padding:12px 18px;

    border-radius:12px;

    background:#111;

    color:white;

    text-align:center;

    font-size:13px;

    transition:.25s;
}

#toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =====================================================
MOBILE
===================================================== */

@media(max-width:850px){

    .sidebar{
        display:none;
    }

    .main{
        left:0;
    }

    .page{
        padding:18px;

        padding-bottom:95px;
    }

    .mobileNav{
        display:flex;
    }

    .homeGrid{
        grid-template-columns:1fr;
    }

    .pageTitle{
        font-size:26px;
    }

    .aiLayout{
        height:calc(100vh - 110px);

        display:flex;

        flex-direction:column;
    }

    .conversationPanel{
        height:auto;

        max-height:150px;

        min-height:0;
    }

    .conversationList{
        max-height:70px;
    }

    .chatPanel{
        min-height:0;

        flex:1;
    }

    .messageBubble{
        max-width:90%;
    }

    .devGrid{
        grid-template-columns:1fr;
    }

    .welcomeTitle{
        font-size:30px;
    }

    .welcomeAvatar{
        width:90px;
        height:90px;
    }

}

</style>

</head>

<body>


<!-- =====================================================
WELCOME
===================================================== -->

<div id="welcomeScreen">

    <div class="welcomeBox">

        <img
            class="welcomeAvatar"
            id="welcomeAvatar"
            src="https://tr.rbxcdn.com/30DAY-AvatarHeadshot-Png/150/150/AvatarHeadshot/Webp/noFilter"
        >

        <div class="welcomeTitle">
            Selamat Datang
        </div>

        <div
            class="welcomeUsername"
            id="welcomeUsername"
        >
            KAEL ASSISTANT
        </div>

        <div class="welcomeSub">
            Selamat Datang Pengguna
        </div>

    </div>

    <button id="skipWelcome">
        Skip
    </button>

</div>


<!-- =====================================================
AUTH
===================================================== -->

<div id="authScreen">

    <div class="authCard">

        <img
            class="authLogo"
            src="https://tr.rbxcdn.com/30DAY-AvatarHeadshot-Png/150/150/AvatarHeadshot/Webp/noFilter"
        >

        <div class="authTitle">
            KAEL ASSISTANT
        </div>

        <div class="authSubtitle">
            Login menggunakan akun KAEL ASSISTANT
        </div>


        <div class="authTabs">

            <button
                class="authTab active"
                id="loginTab"
            >
                Login
            </button>

            <button
                class="authTab"
                id="registerTab"
            >
                Sign Up
            </button>

        </div>


        <!-- LOGIN -->

        <div
            id="loginForm"
            class="authForm active"
        >

            <input
                id="loginUsername"
                class="authInput"
                placeholder="Username Roblox"
                autocomplete="username"
            >

            <input
                id="loginPassword"
                class="authInput"
                type="password"
                placeholder="Password KAEL ASSISTANT"
                autocomplete="current-password"
            >

            <button
                id="loginButton"
                class="authMainButton"
            >
                Login
            </button>

        </div>


        <!-- REGISTER -->

        <div
            id="registerForm"
            class="authForm"
        >

            <input
                id="registerUsername"
                class="authInput"
                placeholder="Username Roblox"
                autocomplete="username"
            >
