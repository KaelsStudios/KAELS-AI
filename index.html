<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>KAEL ASSISTANT</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f5f7;
    color:#111;
}

button,input,textarea,select{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =====================================================
WELCOME
===================================================== */

#welcomeScreen{
    position:fixed;
    inset:0;
    z-index:999999;
    background:rgba(0,0,0,.70);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    transition:.4s ease;
}

#welcomeScreen.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.welcomeBox{
    width:92%;
    max-width:500px;
    text-align:center;
}

.welcomeAvatar{
    width:105px;
    height:105px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid white;
    margin-bottom:18px;
    box-shadow:0 15px 40px rgba(0,0,0,.5);
}

.welcomeTitle{
    font-size:38px;
    font-weight:900;
    color:#000;
    -webkit-text-stroke:2px white;
    text-shadow:0 5px 15px rgba(0,0,0,.6);
}

.welcomeUsername{
    margin-top:9px;
    font-size:19px;
    font-weight:800;
}

.welcomeSub{
    margin-top:5px;
    color:#ddd;
}

#skipWelcome{
    position:absolute;
    right:20px;
    bottom:20px;
    padding:13px 24px;
    border-radius:13px;
    background:#fff;
    color:#111;
    font-weight:900;
    box-shadow:0 8px 25px rgba(0,0,0,.35);
}

#skipWelcome:active{
    transform:scale(.94);
}

/* =====================================================
LOGIN
===================================================== */

#loginScreen{
    position:fixed;
    inset:0;
    z-index:99998;
    background:#f5f5f7;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

#loginScreen.show{
    display:flex;
}

.loginCard{
    width:100%;
    max-width:430px;
    padding:30px 23px;
    border-radius:25px;
    background:white;
    box-shadow:0 20px 70px rgba(0,0,0,.14);
    text-align:center;
}

.loginLogo{
    width:80px;
    height:80px;
    border-radius:20px;
    margin-bottom:15px;
}

.loginTitle{
    font-size:29px;
    font-weight:900;
}

.loginSub{
    color:#777;
    margin-top:7px;
    margin-bottom:25px;
}

.loginButton{
    width:100%;
    height:52px;
    border-radius:14px;
    background:#111;
    color:#fff;
    font-weight:900;
    font-size:15px;
}

.demoLogin{
    width:100%;
    height:45px;
    margin-top:10px;
    border-radius:13px;
    background:#eee;
    color:#111;
    font-weight:800;
}

/* =====================================================
APP
===================================================== */

#app{
    display:none;
    position:fixed;
    inset:0;
    overflow:hidden;
}

#app.show{
    display:block;
}

#app.white{
    background:#f5f5f7;
    color:#111;
}

#app.dark{
    background:#101114;
    color:#fff;
}

#app.purple{
    background:linear-gradient(135deg,#f2e7ff,#fff);
    color:#111;
}

#app.blue{
    background:linear-gradient(135deg,#dceeff,#fff);
    color:#111;
}

/* =====================================================
SIDEBAR
===================================================== */

.sidebar{
    position:absolute;
    top:0;
    left:0;
    bottom:0;
    width:250px;
    padding:15px 12px;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(20px);
    border-right:1px solid #ddd;
    z-index:100;
}

.dark .sidebar{
    background:rgba(20,21,25,.97);
    border-color:#292a2f;
}

.logoArea{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px;
    margin-bottom:15px;
}

.logoArea img{
    width:42px;
    height:42px;
    border-radius:12px;
}

.logoArea span{
    font-weight:900;
    font-size:17px;
}

.sideBtn{
    width:100%;
    height:45px;
    margin-bottom:5px;
    border-radius:12px;
    padding:0 13px;
    background:transparent;
    color:inherit;
    text-align:left;
    font-weight:800;
}

.sideBtn.active{
    background:#111;
    color:#fff;
}

.dark .sideBtn.active{
    background:#fff;
    color:#111;
}

/* =====================================================
MAIN
===================================================== */

.main{
    position:absolute;
    top:0;
    right:0;
    bottom:0;
    left:250px;
    overflow:hidden;
}

.page{
    display:none;
    height:100%;
    width:100%;
    overflow-y:auto;
    padding:30px;
    padding-bottom:100px;
}

.page.active{
    display:block;
}

.pageTitle{
    font-size:30px;
    font-weight:900;
}

.pageDesc{
    margin-top:6px;
    margin-bottom:24px;
    color:#777;
}

.dark .pageDesc{
    color:#aaa;
}

/* =====================================================
HOME
===================================================== */

.hero{
    border-radius:25px;
    padding:30px;
    min-height:240px;
    background:#111;
    color:#fff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    box-shadow:0 15px 40px rgba(0,0,0,.12);
}

.hero h1{
    font-size:35px;
    font-weight:900;
}

.hero p{
    margin-top:9px;
    color:#bbb;
}

.homeGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-top:18px;
}

.homeCard{
    min-height:125px;
    padding:20px;
    text-align:left;
    border-radius:20px;
    background:#fff;
    border:1px solid #ddd;
    color:#111;
}

.dark .homeCard{
    background:#1a1b20;
    border-color:#2b2c31;
    color:#fff;
}

.homeCard:active{
    transform:scale(.98);
}

.homeCard h3{
    font-size:18px;
}

.homeCard p{
    color:#777;
    margin-top:7px;
    line-height:1.4;
}

/* =====================================================
AI LAYOUT
===================================================== */

.aiLayout{
    height:calc(100vh - 60px);
    display:grid;
    grid-template-columns:245px 1fr;
    gap:15px;
}

/* =====================================================
CONVERSATION SIDEBAR
===================================================== */

.conversationPanel{
    height:100%;
    background:#fff;
    border:1px solid #ddd;
    border-radius:20px;
    padding:12px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.dark .conversationPanel{
    background:#18191e;
    border-color:#2a2b30;
}

.newConversation{
    width:100%;
    height:46px;
    border-radius:12px;
    background:#111;
    color:#fff;
    font-weight:900;
    margin-bottom:10px;
}

.dark .newConversation{
    background:#fff;
    color:#111;
}

.conversationTitle{
    padding:7px 5px 9px;
    color:#777;
    font-size:12px;
    font-weight:900;
    text-transform:uppercase;
}

.conversationList{
    flex:1;
    overflow-y:auto;
}

.conversationItem{
    position:relative;
    width:100%;
    min-height:50px;
    padding:9px 35px 9px 10px;
    margin-bottom:5px;
    border-radius:11px;
    background:transparent;
    color:inherit;
    text-align:left;
}

.conversationItem:hover,
.conversationItem.active{
    background:#eee;
}

.dark .conversationItem:hover,
.dark .conversationItem.active{
    background:#292a30;
}

.conversationName{
    font-size:13px;
    font-weight:800;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.deleteConversation{
    position:absolute;
    right:7px;
    top:50%;
    transform:translateY(-50%);
    width:25px;
    height:25px;
    border-radius:7px;
    background:transparent;
    color:#999;
}

.deleteConversation:hover{
    background:#ddd;
    color:#111;
}

/* =====================================================
CHAT
===================================================== */

.chatPanel{
    min-width:0;
    height:100%;
    display:flex;
    flex-direction:column;
}

.chatHeader{
    min-height:50px;
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:900;
}

#currentConversationTitle{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.aiMessages{
    flex:1;
    overflow-y:auto;
    padding:10px 5px 20px;
}

.messageRow{
    display:flex;
    margin-bottom:17px;
}

.messageRow.user{
    justify-content:flex-end;
}

.messageBubble{
    max-width:82%;
    padding:14px 16px;
    border-radius:18px;
    line-height:1.55;
    white-space:pre-wrap;
    background:#e9e9eb;
    color:#111;
}

.dark .messageBubble{
    background:#202126;
    color:#fff;
}

.messageRow.user .messageBubble{
    background:#111;
    color:#fff;
}

.dark .messageRow.user .messageBubble{
    background:#fff;
    color:#111;
}

.codeContainer{
    width:min(850px,85%);
}

.codeTitle{
    margin-bottom:7px;
    font-weight:900;
}

.codeBlock{
    background:#090909;
    color:#fff;
    border-radius:12px;
    padding:14px;
    overflow-x:auto;
    white-space:pre;
    font-family:monospace;
    font-size:12px;
}

.copyButton{
    margin-top:8px;
    padding:8px 12px;
    border-radius:8px;
    background:#fff;
    color:#111;
    font-weight:800;
    font-size:12px;
}

.processing{
    color:#777;
    font-style:italic;
}

.chatComposer{
    display:flex;
    gap:8px;
    padding:10px 0;
}

#aiInput{
    flex:1;
    min-height:52px;
    max-height:140px;
    resize:none;
    border:1px solid #d5d5d5;
    border-radius:15px;
    padding:14px;
    outline:none;
    background:#fff;
    color:#111;
}

#sendAI{
    width:54px;
    border-radius:15px;
    background:#111;
    color:#fff;
    font-size:19px;
}

.dark #sendAI{
    background:#fff;
    color:#111;
}

/* =====================================================
KITS
===================================================== */

.kitGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:15px;
}

.kitCard{
    background:#fff;
    border:1px solid #ddd;
    border-radius:20px;
    padding:20px;
}

.dark .kitCard{
    background:#191a1f;
    border-color:#2b2c31;
}

.kitCard h3{
    font-size:17px;
}

.kitCard p{
    color:#777;
    margin-top:7px;
}

.kitId{
    margin-top:15px;
    padding:11px;
    background:#eee;
    border-radius:10px;
    font-family:monospace;
    font-size:12px;
}

.dark .kitId{
    background:#101114;
}

.smallBtn{
    margin-top:10px;
    height:40px;
    padding:0 15px;
    border-radius:10px;
    background:#111;
    color:#fff;
    font-weight:800;
}

/* =====================================================
USERS
===================================================== */

.userGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:12px;
}

.userCard{
    display:flex;
    align-items:center;
    gap:12px;
    padding:15px;
    border-radius:18px;
    background:#fff;
    border:1px solid #ddd;
}

.dark .userCard{
    background:#191a1f;
    border-color:#2b2c31;
}

.userAvatar{
    width:48px;
    height:48px;
    border-radius:50%;
}

.userStatus{
    color:#777;
    font-size:12px;
    margin-top:3px;
}

/* =====================================================
DEVELOPMENT
===================================================== */

.devGrid{
    display:grid;
    grid-template-columns:230px 1fr;
    gap:15px;
}

.devBox{
    background:#fff;
    border:1px solid #ddd;
    border-radius:20px;
    padding:20px;
}

.dark .devBox{
    background:#191a1f;
    border-color:#2b2c31;
}

.countrySelect{
    width:100%;
    height:45px;
    border-radius:10px;
    border:1px solid #ddd;
    padding:0 10px;
}

.globalChat{
    height:400px;
    overflow-y:auto;
}

.chatLine{
    padding:10px 0;
    border-bottom:1px solid #eee;
}

.dark .chatLine{
    border-color:#2a2b30;
}

.chatAuthor{
    font-weight:900;
    font-size:13px;
}

.chatCountry{
    color:#777;
    font-size:11px;
}

.chatText{
    margin-top:4px;
}

.chatSend{
    display:flex;
    gap:7px;
    margin-top:10px;
}

#globalChatInput{
    flex:1;
    height:45px;
    border:1px solid #ddd;
    border-radius:11px;
    padding:0 12px;
}

#sendGlobalChat{
    width:75px;
    border-radius:11px;
    background:#111;
    color:#fff;
    font-weight:800;
}

/* =====================================================
PROFILE
===================================================== */

.profileBox{
    max-width:560px;
    background:#fff;
    border:1px solid #ddd;
    border-radius:23px;
    padding:25px;
}

.dark .profileBox{
    background:#191a1f;
    border-color:#2b2c31;
}

.profileAvatar{
    width:90px;
    height:90px;
    border-radius:50%;
}

.profileDisplay{
    font-size:25px;
    font-weight:900;
    margin-top:12px;
}

.profileInfo{
    color:#777;
    margin-top:4px;
}

.profileInput{
    width:100%;
    height:46px;
    margin-top:20px;
    border:1px solid #ddd;
    border-radius:11px;
    padding:0 12px;
}

.profileAction{
    margin-top:10px;
    height:45px;
    padding:0 17px;
    border-radius:11px;
    background:#111;
    color:#fff;
    font-weight:900;
}

/* =====================================================
SETTINGS
===================================================== */

.settingsBox{
    max-width:600px;
    background:#fff;
    border:1px solid #ddd;
    border-radius:23px;
    padding:20px;
}

.dark .settingsBox{
    background:#191a1f;
    border-color:#2b2c31;
}

.settingRow{
    padding:15px 0;
    border-bottom:1px solid #eee;
}

.dark .settingRow{
    border-color:#292a30;
}

.settingLabel{
    font-weight:900;
    margin-bottom:10px;
}

.bgButtons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.bgBtn{
    padding:10px 14px;
    border-radius:10px;
    background:#eee;
    color:#111;
    font-weight:800;
}

.logoutBtn{
    width:100%;
    height:48px;
    margin-top:20px;
    border-radius:12px;
    background:#111;
    color:#fff;
    font-weight:900;
}

/* =====================================================
MOBILE NAV
===================================================== */

.mobileNav{
    display:none;
    position:fixed;
    z-index:999;
    left:9px;
    right:9px;
    bottom:9px;
    height:65px;
    border-radius:20px;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(20px);
    box-shadow:0 10px 35px rgba(0,0,0,.2);
    justify-content:space-around;
    align-items:center;
}

.dark .mobileNav{
    background:rgba(25,26,31,.96);
}

.mobileNav button{
    width:18%;
    height:53px;
    border-radius:13px;
    background:transparent;
    color:#777;
    font-size:10px;
    font-weight:900;
}

.mobileNav button.active{
    background:#111;
    color:#fff;
}

.dark .mobileNav button.active{
    background:#fff;
    color:#111;
}

/* =====================================================
TOAST
===================================================== */

#toast{
    position:fixed;
    left:50%;
    bottom:85px;
    z-index:9999999;
    transform:translateX(-50%) translateY(20px);
    opacity:0;
    pointer-events:none;
    max-width:90%;
    padding:12px 18px;
    border-radius:12px;
    background:#111;
    color:#fff;
    text-align:center;
    font-size:13px;
    transition:.25s;
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =====================================================
MOBILE
===================================================== */

@media(max-width:850px){

    .sidebar{
        display:none;
    }

    .main{
        left:0;
    }

    .page{
        padding:18px;
        padding-bottom:95px;
    }

    .mobileNav{
        display:flex;
    }

    .homeGrid{
        grid-template-columns:1fr;
    }

    .pageTitle{
        font-size:26px;
    }

    .aiLayout{
        height:calc(100vh - 110px);
        display:flex;
        flex-direction:column;
    }

    .conversationPanel{
        height:auto;
        max-height:150px;
        min-height:0;
    }

    .conversationList{
        max-height:70px;
    }

    .chatPanel{
        min-height:0;
        flex:1;
    }

    .messageBubble{
        max-width:90%;
    }

    .devGrid{
        grid-template-columns:1fr;
    }

    .welcomeTitle{
        font-size:30px;
    }

    .welcomeAvatar{
        width:90px;
        height:90px;
    }

}
</style>
</head>

<body>

<!-- =====================================================
WELCOME
===================================================== -->

<div id="welcomeScreen">

    <div class="welcomeBox">

        <img
            class="welcomeAvatar"
            src="https://tr.rbxcdn.com/30DAY-AvatarHeadshot-Png/150/150/AvatarHeadshot/Webp/noFilter"
            onerror="this.src='https://www.roblox.com/headshot-thumbnail/image?userId=1&width=150&height=150&format=png'"
        >

        <div class="welcomeTitle">
            Selamat Datang
        </div>

        <div class="welcomeUsername">
            cntl78
        </div>

        <div class="welcomeSub">
            Selamat Datang Pengguna
        </div>

    </div>

    <button id="skipWelcome">
        Skip
    </button>

</div>


<!-- =====================================================
LOGIN
===================================================== -->

<div id="loginScreen">

    <div class="loginCard">

        <img
            class="loginLogo"
            src="https://tr.rbxcdn.com/30DAY-AvatarHeadshot-Png/150/150/AvatarHeadshot/Webp/noFilter"
        >

        <div class="loginTitle">
            KAEL ASSISTANT
        </div>

        <div class="loginSub">
            Masuk ke KAEL ASSISTANT
        </div>

        <button
            id="googleLogin"
            class="loginButton"
        >
            🔵 Continue with Google
        </button>

        <button
            id="demoLogin"
            class="demoLogin"
        >
            Masuk sebagai cntl78
        </button>

    </div>

</div>


<!-- =====================================================
APP
===================================================== -->

<div id="app" class="white">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logoArea">

            <img
                src="https://tr.rbxcdn.com/30DAY-AvatarHeadshot-Png/150/150/AvatarHeadshot/Webp/noFilter"
            >

            <span>
                KAEL ASSISTANT
            </span>

        </div>

        <button class="sideBtn active" data-page="home">
            🏠 Home
        </button>

        <button class="sideBtn" data-page="ai">
            🤖 Roblox AI
        </button>

        <button class="sideBtn" data-page="kits">
            🧰 Kits
        </button>

        <button class="sideBtn" data-page="users">
            🌎 Pengguna
        </button>

        <button class="sideBtn" data-page="development">
            💬 Development
        </button>

        <button class="sideBtn" data-page="profile">
            👤 Profile
        </button>

        <button class="sideBtn" data-page="settings">
            ⚙️ Settings
        </button>

    </aside>


    <main class="main">

        <!-- =================================================
        HOME
        ================================================= -->

        <section
            id="page-home"
            class="page active"
        >

            <div class="hero">

                <h1>
                    Selamat Datang 👋
                </h1>

                <p id="homeText">
                    Selamat datang di KAEL ASSISTANT.
                </p>

            </div>

            <div class="homeGrid">

                <button
                    class="homeCard"
                    data-page="ai"
                >

                    <h3>
                        🤖 Roblox AI
                    </h3>

                    <p>
                        Tanya tentang Roblox,
                        Lua dan pembuatan game.
                    </p>

                </button>
